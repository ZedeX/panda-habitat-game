name: Deploy to Cloudflare Pages

# 说明：
# - 需要在仓库 Settings > Secrets > Actions 配置 CLOUDFLARE_API_TOKEN
#   （Cloudflare Account API Token，需 Cloudflare Pages: Edit 权限）。
# - 未配置 secret 时此 workflow 会失败，可用本地部署替代：
#     cd web && wrangler pages deploy . --project-name panda-habitat-game --branch main
#   （使用本地 wrangler OAuth 登录，已是可靠路径）

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install wrangler 4
        run: npm install -g wrangler@4

      - name: Deploy to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret not set - skip auto deploy. Use local wrangler deploy instead."
            exit 0
          fi
          wrangler pages deploy . --project-name panda-habitat-game --branch main --commit-dirty=true
