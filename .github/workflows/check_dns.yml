name: DNS Check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: List DNS records for zhaozhiru.com
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONES=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?per_page=50")
          echo "$ZONES" | jq -r '.result[] | "\(.id) \(.name)"' || echo "$ZONES" | head -c 500
