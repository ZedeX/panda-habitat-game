name: Copy Secret
on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'target repo'
        required: true
        default: 'ZedeX/panda-habitat-game'
jobs:
  copy:
    runs-on: ubuntu-24.04
    steps:
      - name: Copy CLOUDFLARE_API_TOKEN to target repo
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ inputs.target_repo }}
        run: |
          # Encrypt the token to target repo's key and set as secret via API
          KEY=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/$TARGET/actions/secrets/public-key")
          PUBKEY=$(echo "$KEY" | jq -r '.key')
          KEYID=$(echo "$KEY" | jq -r '.key_id')
          echo "got pubkey: $KEYID"
          # Use python libsodium sealed box via PyNaCl (preinstalled? no) - use node tweetnacl instead
          node -e "
          const nacl = null;
          " 2>/dev/null || pip install pynacl -q
          python3 -c "
          import base64, json, os, sys
          from nacl import encoding, public
          pk = public.PublicKey('$PUBKEY'.encode(), encoding.Base64Encoder())
          sealed = public.SealedBox(pk)
          enc = sealed.encrypt(os.environ['CF_TOKEN'].encode())
          print(base64.b64encode(enc).decode())
          " > /tmp/enc.txt
          ENC=$(cat /tmp/enc.txt)
          curl -s -X PUT -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$TARGET/actions/secrets/CLOUDFLARE_API_TOKEN" \
            -d "{\"encrypted_value\":\"$ENC\",\"key_id\":\"$KEYID\"}" | jq -c '{status: .status? // 201}'
          echo done
